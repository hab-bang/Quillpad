# Builds the signed Quillpad package (x64 and ARM64).
#   Push a tag like v0.1.0 on a commit in main -> builds version 0.1.0.0, signs it with the release
#                                                 certificate, attests it and publishes a GitHub Release.
#   Run it by hand                             -> builds version 0.0.0.<run number>, signs it with a throwaway
#                                                 certificate made for that run and keeps it as a workflow artifact.
# The release certificate is in the `release` environment as SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD:
# a self-signed certificate for CN=hab-bang, the Publisher in src/Notepads/Package.appxmanifest.
# That environment accepts only v* tags, so no branch and no manual run can read the certificate.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Check that the tag is on main
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "$env:GITHUB_REF_NAME points at a commit that is not on main." }

      - name: Set the package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v') + '.0'
          } else {
            $version = "0.0.0.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "A release tag must look like v1.2.3, not $env:GITHUB_REF_NAME" }

          $manifest = Join-Path $env:GITHUB_WORKSPACE 'src/Notepads/Package.appxmanifest'
          [xml]$xml = Get-Content $manifest
          $xml.Package.Identity.Version = $version
          $xml.Save($manifest)
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Write the release certificate
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { throw 'The release environment has no SIGNING_PFX_BASE64 secret.' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx", [Convert]::FromBase64String($env:PFX_BASE64))

      # A manual run can build any branch, so it never gets the release certificate. It signs with a
      # certificate that has the same Publisher, made for this run only. To install the build, trust the
      # .cer that comes with it.
      - name: Make a throwaway certificate
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $password = [Guid]::NewGuid().ToString('N')
          "::add-mask::$password"
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=hab-bang' -KeyUsage DigitalSignature `
            -FriendlyName "Quillpad test build $env:GITHUB_RUN_NUMBER" -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddDays(30) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\signing.pfx" `
            -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          Remove-Item $cert.PSPath
          "TEST_PFX_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Build and sign the package
        shell: pwsh
        env:
          RELEASE_PFX_PASSWORD: ${{ github.ref_type == 'tag' && secrets.SIGNING_PFX_PASSWORD || '' }}
        run: |
          $password = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:RELEASE_PFX_PASSWORD } else { $env:TEST_PFX_PASSWORD }
          msbuild src/Notepads.sln /restore /m /nologo /verbosity:minimal `
            /p:Configuration=Production /p:Platform=x64 `
            /p:AppxBundle=Always "/p:AppxBundlePlatforms=x64|arm64" `
            /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxSymbolPackageEnabled=false `
            /p:AppxLogTelemetryFromSideloadingScript=false `
            "/p:AppxPackageDir=$env:RUNNER_TEMP\packages\" `
            /p:AppxPackageSigningEnabled=true `
            "/p:PackageCertificateKeyFile=$env:RUNNER_TEMP\signing.pfx" `
            "/p:PackageCertificatePassword=$password"
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Delete the certificate
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\signing.pfx" -Force -ErrorAction SilentlyContinue

      - name: Collect the release files
        shell: pwsh
        run: |
          $folder = Get-ChildItem "$env:RUNNER_TEMP\packages" -Directory | Select-Object -First 1
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\release"
          $name = "Quillpad_$env:VERSION"

          Copy-Item (Get-ChildItem $folder.FullName -Filter *.msixbundle).FullName "$out\$name.msixbundle"
          Copy-Item (Get-ChildItem $folder.FullName -Filter *.cer).FullName "$out\$name.cer"

          # Leave the framework packages (VCLibs, .NET Native) out of the install zip. Given them,
          # Add-AppDevPackage.ps1 installs them again with -ForceApplicationShutdown even when the
          # same version is installed. Windows then services frameworks that many apps share and
          # force-closes those apps, and if that servicing fails, apps such as Snipping Tool and the
          # Store stop starting. Almost every PC already has both frameworks; where one is missing,
          # double-clicking the .msixbundle gets it from the Store.
          Remove-Item "$($folder.FullName)\Dependencies" -Recurse -Force
          Compress-Archive -Path "$($folder.FullName)\*" -DestinationPath "$out\${name}_install.zip"
          Get-ChildItem $out | Format-Table Name, Length
          Get-ChildItem $folder.FullName -Recurse -File | ForEach-Object { $_.FullName.Substring($folder.FullName.Length + 1) }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Quillpad_${{ env.VERSION }}
          path: ${{ runner.temp }}/release/
          retention-days: ${{ github.ref_type == 'tag' && 1 || 14 }}

  # Publishing runs in its own job, without a checkout or the build, so the code that builds the
  # package never holds a token that can write to the repository.
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Quillpad_${{ needs.build.outputs.version }}
          path: release

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      # Immutable releases lock a release when it is published, so upload to a draft and publish after.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "Quillpad $GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
